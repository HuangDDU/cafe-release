[project]
name = "cafe-release"
version = "0.2.0"
description = "CellFateExplorer (Cafe) - An integrated platform for exploring cell fate "
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zhaoyang Huang", email = "hzy554598474@163.com"},
    {name = "Haonan Ma", email = "hzy554598474@163.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["single-cell", "RNA-seq", "trajectory", "cell fate", "bioinformatics"]

dependencies = [
    # data
    "anndata>=0.11.1",
    "scanpy>=1.11.0",
    "numpy>=1.26.4",
    "pandas>=1.5.3",
    "scipy>=1.12.0",
    # visualization
    "matplotlib>=3.9.3",
    "seaborn>=0.13.2",
    # network and clustering
    "networkx>=3.4.2",
    "igraph>=0.11.8",
    "leidenalg>=0.10.2",
    # machine learning
    "scikit-learn>=1.4.2",
    # tools
    "tqdm>=4.67.1",
    "rich>=13.9.4",
    "joblib>=1.4.2",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    # Docker support
    "docker>=7.1.0",
    # trajectory inference related (optional)
    # "scvelo>=0.3.3",
    # "dynamo-release>=1.4.1",
    # "cellrank>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=4.0.0",
    "black>=25.1.0",
    "isort>=5.12.0",
    "flake8>=7.1.1",
    "pre-commit>=4.3.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.49",
    "mkdocstrings>=0.27.0",
    "mkdocstrings-python>=1.12.2",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-bibtex>=4.1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
]
trajectory = [
    "scvelo>=0.3.3",
    "cellrank>=2.0.7",
    "palantir>=1.3.6",
    "dynamo-release>=1.4.1",
]

# TODO: update later
[project.urls]
Homepage = "https://github.com/HuangDDU/Cafe"
Documentation = "https://cafe.readthedocs.io" # 
Repository = "https://github.com/HuangDDU/Cafe"

[tool.setuptools.package-data]
cafe = ["method/*.csv", "metric/*.csv"]


[tool.black]
line-length = 150

[tool.flake8]
max-line-length = 150
ignore = [
    "E203", # 空格问题（black 会处理）
    "E501", # 行长度（由 max-line-length 控制）
    "W503", # 运算符换行风格（black 兼容）
    "W291", # 行尾空格（logo 字符串需要保留）
    "W293", # 空行中的空格（logo 字符串需要保留）
    "B008", # 函数默认参数的可变对象（如 `def foo(a=[])`）
    "B006", # 可变默认参数（如 `def foo(a=[])`）
    "E741", # 模糊的变量名（如 `l`, `O`, `I`）
] # 忽略的错误类型（根据项目需求调整）

# replace "pytest.ini"
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore", # 忽略所有警告
]
# 核心配置
addopts = [
    "-v", # 详细模式， 为了查看具体跳过的测试用例，开启该模式
    # "-n=auto",        # 自动选择线程数，会丢弃掉整洁输出
    "--tb=auto",      # 显示错误回溯
    "-p no:warnings", # 忽略警告
    # "--capture=sys",  # 严格捕获所有输出
    # "--no-showlocals", # 隐藏局部变量
    # "-q",             # 静默模式
    # "--no-header",    # 隐藏头部信息
    # "--no-summary",   # 隐藏统计信息
]
# 日志控制
log_cli = false
log_level = "CRITICAL" # 只显示严重错误
markers = [
    "run_conda_method", # marker for run method in specific conda environment
    "local: only test local", # set it to 'not local' for github workflow to skip them
]

[tool.mytest]
run_conda_method = false