# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
# pre-commit基础配置
# -   repo: https://github.com/pre-commit/pre-commit-hooks
#     rev: v3.2.0
#     hooks:
#     -   id: trailing-whitespace # 删除行尾空格
#     -   id: end-of-file-fixer
#     -   id: check-yaml
#     # -   id: check-added-large-files #不允许大文件保存（不推荐） # Uncomment if you want to check for large files
# 代码格式化 (black)
-   repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=250]  # 可选参数
# import 导入包排序
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]  # 兼容 black 的配置
# 语法检查 (flake8)
-   repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--line-length=250]  # 可选参数
        additional_dependencies: [flake8-bugbear]  # 可选插件
