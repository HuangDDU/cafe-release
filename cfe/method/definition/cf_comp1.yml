method:
  id: comp1
  name: Component 1
  version: 0.0.1
  source: offtheshelf
  platform: R

container:
  url: https://github.com/dynverse/ti_comp1
  docker: dynverse/ti_comp1

wrapper:
  type: linear
  topology_inference: fixed
  trajectory_types: linear
  input_required: expression

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: pca_ndim
  description: Number of principal components to keep in the preprocess pca step.
  type: integer
  default: 5
  distribution:
    type: uniform
    lower: 2
    upper: 30
- id: basis
  description: Projection or embedding space name.
  type: character
  default: X_pca
- id: component
  description: Component index, start from 1.
  type: integer
  default: 1
