method:
  id: cluster_mst
  name: Cluster MST
  source: xxx
  platform: Python

container:
  url: xxx
  docker: xxx

wrapper:
  type: cluster
  topology_inference: free
  trajectory_types:
    - linear
    - bifurcation
    - convergence
    - multifurcation
    - tree
  input_required:
    - counts
  input_optional:
    - groups_id

parameters:
  - id: dimred
    type: character
    default: pca
    values:
      - pca
      - mds
      - tsne
      - ica
      - lle
      - landmark_mds
      - mds_sammon
      - mds_isomds
      - mds_smacof
      - umap
      - dm_diffusionMap
    description: Which dimensionality reduction method to use.
  - id: ndim
    type: integer
    default: 2
    distribution:
      type: uniform
      lower: 2
      upper: 30
  - id: distance_metric
    type: character
    default: euclidean
    values:
      - euclidean
      - cosine
      - manhattan
      - cityblock
      - l1
      - l2
