# ref: https://github.com/dynverse/ti_paga/blob/master/definition.yml
method:
  id: scvelo
  name: scVelo
  version: 0.0.1
  tool_id: scvelo
  source: tool
  platform: Python
  url: https://github.com/theislab/scvelo

wrapper:
  type: velocity
  # # topology_inference: free
  # trajectory_types:
  # - cycle
  # - linear
  # - bifurcation
  # - convergence
  # - multifurcation
  # - tree
  # - acyclic_graph
  # - graph
  # - disconnected_graph
  input_required:
  - counts
  # input_optional:
  # # TODO: if prior information is needed?
  # - groups_id

container:
  docker: dynverse/ti_paga
  url: https://github.com/dynverse/ti_paga

# manuscript:
#   doi: 10.1186/s13059-019-1663-x
#   google_scholar_cluster_id: '10470081259069082868'
#   preprint_date: '2017-10-27'
#   publication_date: '2019-03-19'

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: filter_and_normalize_kwargs
  description: Parameters for preprocess in scvelo style, refer to "scvelo.pp.filter_and_normalize"(https://scvelo.readthedocs.io/en/stable/scvelo.pp.filter_and_normalize.html)
  type: dict
  update: True
  default:
    min_shared_counts: 20
    n_top_genes: 2000
- id: moments_kwargs
  description: Parameters for neighbor moment in scvelo style, refer to "scvelo.pp.moments"(https://scvelo.readthedocs.io/en/stable/scvelo.pp.moments.html)
  type: dict
  update: True
  default:
    n_pcs: 20
    n_neighbors: 30
- id: velocity_kwargs
  description: refer to https://scvelo.readthedocs.io/en/stable/scvelo.tl.velocity.html
  update: True
  type: dict
  default: {}
- id: velocity_graph_kwargs
  description: refer to https://scvelo.readthedocs.io/en/stable/scvelo.tl.velocity_embedding.html
  update: True
  type: dict
  default: {}
