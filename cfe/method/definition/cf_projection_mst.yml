method:
  id: projection_mst
  name: Projection MST
  version: 0.0.1
  source: offtheshelf
  platform: Python

container:
  url: https://github.com/dynverse/ti_mst
  docker: dynverse/ti_mst

wrapper:
  type: projection
  topology_inference: free
  trajectory_types:
  - linear
  - bifurcation
  - convergence
  - multifurcation
  - tree
  input_required:
  - expression
  input_optional:
  - groups_id


parameters:
  - id: dimred
    type: character
    default: pca
    values:
    - pca
    - mds
    - tsne
    - ica
    - lle
    - landmark_mds
    - mds_sammon
    - mds_isomds
    - mds_smacof
    - umap
    - dm_diffusionMap
    description: Which dimensionality reduction method to use.
  - id: ndim
    type: integer
    default: 5
    distribution:
      type: uniform
      lower: 2
      upper: 30
  - id: distance_metric
    type: character
    default: euclidean
    values:
    - euclidean
    - cosine
    - manhattan
    - cityblock
    - l1
    - l2
