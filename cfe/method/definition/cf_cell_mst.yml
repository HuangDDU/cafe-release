method:
  id: cell_mst
  name: Cell_MST
  source: xxx
  platform: R

container:
  url: xxx
  docker: xxx

wrapper:
  type: cell_graph
  topology_inference: free
  trajectory_types:
    - linear
    - bifurcation
    - convergence
    - multifurcation
    - tree
  input_required: counts

parameters:
  - id: dimred
    type: character
    default: pca
    values:
      - pca
      - mds
      - tsne
      - ica
      - lle
      - landmark_mds
      - mds_sammon
      - mds_isomds
      - mds_smacof
      - umap
      - dm_diffusionMap
    description: Which dimensionality reduction method to use.
  - id: ndim
    type: integer
    default: 5
    distribution:
      type: uniform
      lower: 2
      upper: 30
