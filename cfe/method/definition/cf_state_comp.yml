method:
  id: state_comp
  name: state_comp
  source: xxx
  platform: Python

container:
  url: xxx
  docker: xxx

wrapper:
  type: end_state_probabilities
  topology_inference: free
  trajectory_types:
    - linear
    - bifurcation
    - convergence
    - multifurcation
    - tree
  input_required: counts

parameters:
  - id: dimred
    type: character
    default: pca
    values:
      - pca
      - mds
      - tsne
      - ica
      - lle
      - landmark_mds
      - mds_sammon
      - mds_isomds
      - mds_smacof
      - umap
      - dm_diffusionMap
    description: Which dimensionality reduction method to use.
  - id: ndim
    type: integer
    default: 2
    distribution:
      type: uniform
      lower: 2
      upper: 30
  - id: component
    type: integer
    default: 1
    distribution:
      type: uniform
      lower: 1
      upper: 10
