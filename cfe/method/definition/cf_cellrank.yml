method:
  id: cellrank
  name: CellRank
  version: 0.0.1
  source: offtheshelf
  platform: Python

container:
  url: https://github.com/dynverse/ti_comp1
  docker: dynverse/ti_comp1

wrapper:
  type:
    - probability
    - lineage
  topology_inference: fixed
  trajectory_types: linear
  input_required:
  - counts

parameters:
  - id: dimred
    description: Which dimensionality reduction method to use.
    type: character
    default: pca
    values:
    - pca
    - mds
    - tsne
    - ica
    - lle
    - landmark_mds
    - mds_sammon
    - mds_isomds
    - mds_smacof
    - umap
    - dm_diffusionMap
  - id: ndim
    type: integer
    default: 2
    distribution:
      type: uniform
      lower: 2
      upper: 30
  - id: knn
    type: integer
    default: 30
    distribution:
      type: uniform
      lower: 10
      upper: 50
