# ref: https://github.com/dynverse/ti_paga/blob/master/definition.yml
method:
  id: paga
  name: PAGA
  version: 0.0.1
  tool_id: paga
  source: tool
  platform: Python
  url: https://github.com/theislab/graph_abstraction
  authors:
  - given: Alexander
    family: Wolf
    email: alex.wolf@helmholtz-muenchen.de
    github: falexwolf
    ORCID: 0000-0002-8760-7838
  - given: Fabian
    family: Theis
    email: fabian.theis@helmholtz-muenchen.de
    github: theislab

wrapper:
  type: branch
  topology_inference: free
  trajectory_types:
  - cycle
  - linear
  - bifurcation
  - convergence
  - multifurcation
  - tree
  - acyclic_graph
  - graph
  - disconnected_graph
  input_required:
  - counts
  - start_id
  # input_optional:
  # # TODO: if prior information is needed?
  # - groups_id

container:
  docker: dynverse/ti_paga
  url: https://github.com/dynverse/ti_paga

manuscript:
  doi: 10.1186/s13059-019-1663-x
  google_scholar_cluster_id: '10470081259069082868'
  preprint_date: '2017-10-27'
  publication_date: '2019-03-19'

parameters:
- id: cluster_key
  description: Key in the data frame that contains the cluster assignments.
  type: character
  default: clusters
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: filter_and_normalize_kwargs
  description: Parameters for preprocess in scvelo style, refer to "scvelo.pp.filter_and_normalize"(https://scvelo.readthedocs.io/en/stable/scvelo.pp.filter_and_normalize.html)
  type: dict
  update: True
  default:
    min_shared_counts: 20
    n_top_genes: 2000
- id: neighbors_kwargs
  description: Parameters for neighbor construction in scanpy style, refer to https://scanpy.readthedocs.io/en/latest/api/generated/scanpy.pp.neighbors.html
  type: dict
  update: True
  default:
    n_pcs: 20
    n_neighbors: 30
- id: n_dcs
  description: Number of diffusion components for denoising graph, 0 means no denoising.
  type: integer
  default: 15
  distribution:
    type: uniform
    lower: 0
    upper: 40
- id: connectivity_cutoff
  description: Cutoff for the connectivity matrix
  type: numeric
  default: 0.5
  distribution:
    type: uniform
    lower: 0
    upper: 1
