method:
    id: palantir
    name: Palantir
    version: 0.0.1
    source: offtheshelf
    platform: Python

container:
    url: https://github.com/dynverse/ti_comp1
    docker: dynverse/ti_comp1

wrapper:
    type: linear
    topology_inference: fixed
    trajectory_types: linear
    input_required:
      - counts
      # - start_id
      # input_optional:
      # - terminal_states

parameters:
  - id: repreprocess
    description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
    type: boolean
    default: True
  - id: complexity_index_kwargs
    description: Parameters for complexity index calculation
    type: dict
    update: True
    default: {}
