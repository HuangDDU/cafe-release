method:
  id: graph_mst
  name: Graph MST
  version: 0.0.1
  source: xxx
  platform: Python

container:
  url: xxx
  docker: xxx

wrapper:
  type: graph
  topology_inference: free
  trajectory_types:
    - linear
    - bifurcation
    - convergence
    - multifurcation
    - tree
  input_required: counts

parameters:
  - id: dimred
    type: character
    default: pca
    values:
      - pca
      - mds
      - tsne
      - ica
      - lle
      - landmark_mds
      - mds_sammon
      - mds_isomds
      - mds_smacof
      - umap
      - dm_diffusionMap
    description: Which dimensionality reduction method to use.
  - id: ndim
    type: integer
    default: 5
    distribution:
      type: uniform
      lower: 2
      upper: 30
  - id: distance_metric
    type: character
    default: euclidean
    values:
      - euclidean
      - cosine
      - manhattan
      - cityblock
      - l1
      - l2
