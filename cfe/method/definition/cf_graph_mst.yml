method:
  id: graph_mst
  name: Graph MST
  version: 0.0.1
  source: xxx
  platform: Python

container:
  url: xxx
  docker: xxx

wrapper:
  type: graph
  topology_inference: free
  trajectory_types:
  - linear
  - bifurcation
  - convergence
  - multifurcation
  - tree
  input_required: counts

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: pca_ndim
  description: Number of principal components to keep in the preprocess pca step.
  type: integer
  default: 5
  distribution:
    type: uniform
    lower: 2
    upper: 30
- id: neighbors_kwargs
  description: refer to https://scanpy.readthedocs.io/en/latest/api/generated/scanpy.pp.neighbors.html
  type: dict
  update: True
  default:
    n_neighbors: 15
    n_pcs: 15
