method:
  id: angle
  name: Angle
  version: 0.0.1
  source: offtheshelf
  platform: Python

wrapper:
  type: cycle
  topology_inference: fixed
  trajectory_types: cycle
  input_required: expression

container:
  docker: dynverse/ti_angle
  url: https://github.com/dynverse/ti_angle

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: pca_ndim
  description: Number of principal components to keep in the preprocess pca step.
  type: integer
  default: 5
  distribution:
    type: uniform
    lower: 2
    upper: 30
- id: basis
  description: Projection or embedding space name.
  type: character
  default: X_pca
