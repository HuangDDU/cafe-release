method:
  id: state_comp
  name: State Component
  version: 0.0.1
  source: xxx
  platform: Python

container:
  url: xxx
  docker: xxx

wrapper:
  type: probability
  topology_inference: free
  trajectory_types:
  - linear
  - bifurcation
  - convergence
  - multifurcation
  - tree
  input_required: counts

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: n_comps
  description: Number of end state
  type: integer
  default: 2
  distribution:
    type: uniform
    lower: 1
    upper: 30
- id: basis
  description: Projection or embedding space name.
  type: character
  default: X_pca
- id: pseudotime_index
  description: Index of the pseudotime column in embedding space.
  type: integer
  default: 1
