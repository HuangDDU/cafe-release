method:
  id: velovi
  name: veloVI
  version: 0.0.1
  tool_id: velovi
  source: tool
  platform: Python
  url: https://github.com/yoseflab/velovi

wrapper:
  type: velocity
  input_required:
  - counts
  input_optional:
  - cluster_key # prior_information

# TODO: add docker container
container:
  docker: cfe/cf_velovi

manuscript:
  doi: doi.org/10.1038/s41592-023-01994-w

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: filter_and_normalize_kwargs
  description: Parameters for preprocess in scvelo style, refer to "scvelo.pp.filter_and_normalize"(https://scvelo.readthedocs.io/en/stable/scvelo.pp.filter_and_normalize.html)
  type: dict
  update: True
  default:
    min_shared_counts: 20
    n_top_genes: 2000
- id: moments_kwargs
  description: Parameters for neighbor moment in scvelo style, refer to "scvelo.pp.moments"(https://scvelo.readthedocs.io/en/stable/scvelo.pp.moments.html)
  type: dict
  update: True
  default:
    n_pcs: 30
    n_neighbors: 30
- id: velovi_model_kwargs
  description: Parameters for VeloVI model construction, refer to "scvi.external.VELOVI"(https://docs.scvi-tools.org/en/stable/api/reference/scvi.external.VELOVI.html)
  type: dict
  update: True
  default: {}
- id: velovi_train_kwargs
  description: Parameters for VeloVI model training, refer to "scvi.external.VELOVI.train"(https://docs.scvi-tools.org/en/stable/api/reference/scvi.external.VELOVI.html#VELOVI.train)
  type: dict
  update: True
  default:
    max_epochs: 10
- id: n_sample
  description: number of samples
  type: integer
  default: 25
