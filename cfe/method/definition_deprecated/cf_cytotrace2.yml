method:
  id: cytotrace2
  name: cytotrace2
  version: 0.0.1
  tool_id: cytotrace2
  source: tool
  platform: Python
  url: https://github.com/digitalcytometry/cytotrace2

wrapper:
  type: linear
  input_required:
  - counts

# TODO: add docker container
container:
  docker: cfe/cytotrace2

manuscript:
  doi: doi.org/10.1101/2024.03.19.585637

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: cluster_key
  description: Key in the data frame that contains the cluster assignments.
  type: character
  default: clusters
- id: cytotrace2_kwargs
  description: Parameters for Cytotrace2
  type: dict
  update: True
  default: {}
