method:
  id: palantir
  name: Palantir
  version: 0.0.1
  source: offtheshelf
  platform: Python

container:
  url: https://github.com/dynverse/ti_comp1
  docker: dynverse/ti_comp1

wrapper:
  type: probability
  topology_inference: fixed
  trajectory_types: linear
  input_required:
  - counts
  # - start_id
  # input_optional:
  # - terminal_states

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: palantir_kwargs
  description: Parameters for Palantir
  type: dict
  update: True
  default: {}
- id: palantir_results_kwargs
  description: Parameters for Palantir results
  type: dict
  update: True
  default: {}
- id: ndim
  type: integer
  default: 2
  distribution:
    type: uniform
    lower: 2
    upper: 30
- id: knn
  type: integer
  default: 30
  distribution:
    type: uniform
    lower: 10
    upper: 50
- id: linear_type
  type: character
  description: The type of linear trajectory to return. Options are 'pseudotime' or 'entropy'.
  default: pseudotime
  options:
  - pseudotime
  - entropy
