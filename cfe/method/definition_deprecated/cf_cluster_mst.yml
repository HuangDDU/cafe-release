method:
  id: cluster_mst
  name: Cluster MST
  version: 0.0.1
  source: xxx
  platform: Python

container:
  url: xxx
  docker: xxx

wrapper:
  type: cluster
  topology_inference: free
  trajectory_types:
  - linear
  - bifurcation
  - convergence
  - multifurcation
  - tree
  input_required:
  - counts

parameters:
- id: repreprocess
  description: whether reprocess the anndata object, including feature selection, normalization, scale, pca and neighbor computation.
  type: boolean
  default: True
- id: pca_ndim
  description: Number of principal components to keep in the preprocess pca step.
  type: integer
  default: 5
  distribution:
    type: uniform
    lower: 2
    upper: 30
- id: basis
  description: Projection or embedding space name.
  type: character
  default: X_pca
- id: recluster
  description: whether recluster cells.
  type: boolean
  default: True
- id: cluster_key
  description: Key in the data frame that contains the cluster assignments.
  type: character
  default: clusters
- id: distance_metric
  type: character
  default: euclidean
  values:
  - euclidean
  - cosine
  - manhattan
  - cityblock
  - l1
  - l2
