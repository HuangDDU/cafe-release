name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected PEP 440 package version, for example 0.2.1rc1."
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build, check, and validate version
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate release version
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_version="$GITHUB_REF_NAME"
          else
            expected_version="$MANUAL_VERSION"
          fi

          if [ -z "$expected_version" ]; then
            echo "A release version is required for manual releases." >&2
            exit 1
          fi
          python -m pip install packaging tomli
          python scripts/check_version.py --expected "$expected_version"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cafe-release-dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cafe-release

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: cafe-release-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/cafe-release

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: cafe-release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
