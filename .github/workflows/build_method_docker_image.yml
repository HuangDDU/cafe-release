name: Build Method Docker Image

on:
  push:
    branches: [ "dev_method" ]


jobs:
  check-docker-version:
    runs-on: ubuntu-latest
    outputs:
      method_name_list: ${{ steps.get-method-name-list.outputs.method_name_list }}
    steps:
      - uses: actions/checkout@v4
      - name: check-docker-version
        id: get-method-name-list
        run: |
          method_name_list='["cf_paga", "cf_comp1", "cf_angle", "cf_state_comp"]' # TODO: need check from yaml file, get image name and version
          echo "method_name_list=$method_name_list" >> $GITHUB_OUTPUT

  push-docker-image:
    needs: check-docker-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # TODO:
        var: ${{ fromJson(needs.check-docker-version.outputs.method_name_list)}}

    steps:
      - uses: actions/checkout@v4
      - name: Build, Test, Push
        id: build-test-push
        run: |
          bash ./scripts/build_method_docker_image.sh ${{ matrix.var }}
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          # TODO: docker push
